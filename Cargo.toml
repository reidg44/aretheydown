[package]
name = "aretheydown"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "TUI that shows the current status of GitHub, AWS, Azure, and other platforms"
license = "MIT"
repository = "https://github.com/reidg44/aretheydown"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
open = "5.4.5"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rss = { version = "2.1.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.20", default-features = false, features = ["parse", "display"] }
unicode-width = "0.2.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
